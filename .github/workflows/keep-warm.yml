name: Keep Warm

# Render free tier sleeps after ~15 min idle (first request then cold-starts ~22s).
# Ping the public /health liveness endpoint every ~10 min to keep the instance warm
# so demos / judges don't hit a cold start. /health is a cheap always-200 handler.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: |
          curl --fail --show-error --silent --max-time 30 \
            https://devcamp2-backend.onrender.com/health \
            || echo "Ping failed (instance may be cold-starting) — non-fatal"
